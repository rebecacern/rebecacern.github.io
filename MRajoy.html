<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    .container {
        max-width: 800px;
        text-align: center;
        padding: 30px;
    }

    h1 {
        margin-bottom: 30px;
    }

    .quote-box {
        background: rgba(255,255,255,0.12);
        backdrop-filter: blur(8px);
        border-radius: 15px;
        padding: 30px;
        font-size: 1.5rem;
        line-height: 1.5;
        min-height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 25px;
    }

    button {
        font-size: 1.1rem;
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #ffcc00;
        color: #222;
        font-weight: bold;
        transition: 0.2s;
    }

    button:hover {
        transform: scale(1.05);
    }

    .counter {
        margin-top: 15px;
        opacity: 0.8;
    }
</style>
</head>
<body>

<div class="container">

    <div class="quote-box" id="quote">
        Pulsa el botón para obtener una cita aleatoria.
    </div>

    <button onclick="randomQuote()">Nueva Frase</button>


</div>

<script>
const quotes = [

n que ir coches y de los aeropuertos tienen que salir aviones.",        "Quiero decir sí a los chiringuitos. Nos gustan los chiringuitos. Queremos los chiringuitos. Forman parte de nuestro ser, y mientras este partido exista, habrá chiringuitos en Málaga y en Pontevedra también.",        "Todo lo que se ha publicado es falso, salvo alguna cosa, que es lo que han publicado los medios de comunicación.",        "Exportar es positivo porque vendes lo que produces.",        "Da gusto hablar bien de quien se merece que hablen bien de uno, y de aquel del que uno quiere hablar bien porque se lo merece.",        "No se ganan amigos por la vía de la sustitución sino por la vía de la ampliación.",        "Tenemos que fabricar máquinas que nos permitan seguir fabricando máquinas, porque lo que no van a hacer nunca las máquinas es fabricar máquinas a su vez.",        "Quiero que nuestros socios sean los que son: Merkel y Sarkozy. Y si alguien se quiere ir al Partido Liberal o al Partido Conservador, que se vaya.",        "Estamos hartos de Franco y de la República. Miremos al futuro.",        "Esto no es como el agua que cae del cielo, sin que se sepa exactamente por qué.",        "Me gustaría que el Parlament de Cataluña acatase la ley y volver a la normalidad institucional, económica y social.",        "No sé si el Gobierno asumió riesgos, hizo lo que tenía que hacer y volvería a hacer lo mismo.",        "El Gobierno tiene que estar en la mayor y no en pensar si pierde o gana votos con sus decisiones, ya que una de sus obligaciones es evitar una situación disparatada.",        "Me retracto: daremos todas las batallas para que esas situaciones (brecha salarial por género) sean menores.",        "No hay nada amortizado y esas personas ya no están en la política activa y ya no forman parte del PP.",        "Si las elecciones son hoy yo me quiero presentar, si son dentro de 100 años me temo que mis posibilidades son menores.",        "No es lo mismo que gobierne uno que que gobier ];

let previous = -1;

function randomQuote() {
    let index;

    do {
        index = Math.floor(Math.random() * quotes.length);
    } while (index === previous && quotes.length > 1);

    previous = index;

    document.getElementById("quote").textContent = quotes[index];
    document.getElementById("counter").textContent =
        `Rajoyada ${index + 1} de ${quotes.length}`;
}

randomQuote();
</script>

</body>
</html>
